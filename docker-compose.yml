version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg17
    container_name: code-guardian-postgres
    environment:
      POSTGRES_DB: code_guardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_data.sql:/docker-entrypoint-initdb.d/02_init_data.sql
      - ./database/init_permissions.sql:/docker-entrypoint-initdb.d/03_init_permissions.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: always

  # Redis cache
  redis:
    image: redis:7
    container_name: code-guardian-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
