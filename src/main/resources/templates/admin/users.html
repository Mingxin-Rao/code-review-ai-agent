<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - CodeGuardian AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="admin-container">
        <!-- Left sidebar -->
        <aside class="sidebar">
            <div class="logo"><i class="fas fa-shield-alt"></i></div>
            <ul class="sidebar-menu">
                <li><a href="/dashboard" title="Dashboard"><i class="fas fa-chart-pie"></i></a></li>
                <li th:if="${canReview or canQuery}"><a href="/review" title="Search"><i class="fas fa-search"></i></a></li>
                <li th:if="${canQuery}"><a href="/review/reports" title="Tasks"><i class="fas fa-file-lines"></i></a></li>
                <li th:if="${canAdmin}"><a href="/admin/users" class="active" title="Access Control"><i class="fas fa-user-shield"></i></a></li>
                <li th:if="${canAdmin}"><a href="/admin/knowledge" title="Knowledge Base"><i class="fas fa-book"></i></a></li>
                <li th:if="${canConfig}"><a href="/admin/settings" title="Settings"><i class="fas fa-cog"></i></a></li>
            </ul>
        </aside>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Top header bar -->
            <header class="top-header">
                <h1 class="page-title">Access Control</h1>
                <div class="user-section">
                    <div class="user-info">
                        <span class="user-label" th:text="${roleName ?: 'System Administrator'}">System Administrator</span>
                        <span class="username" th:text="${username ?: 'ADMIN'}">ADMIN</span>
                    </div>
                    <div class="user-avatar" id="user-avatar" th:text="${avatarChar ?: 'S'}">S</div>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Log out
                    </button>
                </div>
            </header>

            <!-- Content wrapper -->
            <div class="content-wrapper">
                <!-- Submenu panel -->
                <aside class="submenu-panel">
                    <nav class="submenu-nav">
                        <a th:if="${canAdmin}" href="/admin/users" class="submenu-item active">
                            <i class="fas fa-users"></i>
                            <span>User Management</span>
                        </a>
                        <a th:if="${canAdmin}" href="/admin/roles" class="submenu-item">
                            <i class="fas fa-user-tag"></i>
                            <span>Role Management</span>
                        </a>
                        <a th:if="${canConfig}" href="/admin/permissions" class="submenu-item">
                            <i class="fas fa-key"></i>
                            <span>Permissions</span>
                        </a>
                    </nav>
                </aside>

                <!-- Content area -->
                <div class="content-panel">
                    <!-- Content area -->
                    <div class="content-area">
                        <div class="content-window">
                            <div class="page-header">
                                <h2 class="content-title">User Management</h2>
                                <button class="add-user-btn" onclick="showAddUserModal()">
                                    <span>+</span> Add user
                                </button>
                            </div>

                            <!-- Search and filters -->
                            <div class="search-section">
                                <input 
                                    type="text" 
                                    id="searchInput" 
                                    class="search-input" 
                                    placeholder="Search by username or email..."
                                    onkeyup="handleSearch(event)">
                                <select id="statusFilter" class="filter-select" onchange="loadUsers()">
                                    <option value="">All statuses</option>
                                    <option value="0">Active</option>
                                    <option value="1">Inactive</option>
                                    <option value="2">Locked</option>
                                </select>
                                <select id="roleFilter" class="filter-select" onchange="loadUsers()">
                                    <option value="">All roles</option>
                                </select>
                                <button class="query-btn" onclick="loadUsers()">Search</button>
                                <button class="reset-btn" onclick="resetFilters()">Reset</button>
                            </div>

                            <!-- Users table -->
                            <div class="table-container">
                                <table class="user-table">
                                    <thead>
                                        <tr>
                                            <th>Username</th>
                                            <th>Email</th>
                                            <th>Full Name</th>
                                            <th>Role</th>
                                            <th>Status</th>
                                            <th>Registered</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="userTableBody">
                                        <!-- Loaded dynamically -->
                                    </tbody>
                                </table>
                            </div>

                            <!-- Pagination -->
                            <div class="pagination">
                                <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
                                <span class="page-info" id="pageInfo">Page 1/1 (0 total)</span>
                                <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add / edit user modal -->
    <div id="userModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add User</h2>
                <button class="modal-close" onclick="closeUserModal()">×</button>
            </div>
            <form id="userForm" onsubmit="saveUser(event)">
                <div class="modal-body">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label>Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-group">
                        <label>Full name</label>
                        <input type="text" id="realName">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="0">Active</option>
                            <option value="1">Inactive</option>
                            <option value="2">Locked</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <div id="roleCheckboxes"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeUserModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/http.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
